[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzylli"
version = "0.1.0"
requires-python = "==3.10.*"
readme = "README.md"
dependencies = [
  "joblib==1.3.2",
  "numpy==1.24.4",
  "pandas==2.0.3",
  "scikit-learn==1.3.2",
  "scipy==1.10.1",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers==3.2.1",
  "torch>=2.1",
]
dev = [
  "imbalanced-learn==0.12.4",
  "matplotlib==3.7.4",
  "openai==2.11.0",
  "sentence-transformers==3.2.1",
  "shap==0.44.1",
  "torch>=2.1",
  "xgboost==3.1.2",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fuzzylli = ["resources/**/*"]
